<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<h1 id="i">

</h1>
<h1 id="idd"></h1>
    <script>
        const student={
            firstname:'Evin',
            lastname:'Francis',
            course:"python ful stack",
            fullname:function(){
                return this.firstname+ "_"+ this.lastname
            }
        }
       

        document.getElementById("i").innerHTML=student.fullname();

        const student1={
            firstname:'Evin',
            lastname:'Francis',
            course:"python fullstack",
           
        }
         let result="";
        for(i in student1){
            result +=student1[i]+" ";
        }
        document.getElementById("idd").innerHTML=result;

    </script>
    
</body>
</html>
