<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container" style="width: 200px; margin: auto">
        <h1>Registration Form</h1>
        <form action=""  onsubmit="return password_validation()">
            <input type="password" id="password" placeholder="password" >
            <span id="passerror" style="color: red;"></span><br><br>


            <input type="password" id="confirm-password" placeholder="confirm password">
            <span id="confirmError" style="color: red;"></span><br><br>


            <button type="submit" class="btn btn-primary">Submit</button>

        </form>
    </div>
    
    <script>
        function password_validation(){
            let pass1=document.getElementById("password").value;
            let pass2=document.getElementById("confirm-password").value;
            
            //pattern for strong password
            let strongPass = /^(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*]).{6,}$/;


            // clear the error message
            document.getElementById("passerror").innerHTML="";
            document.getElementById("confirmError").innerHTML="";
            // password validation
            if (pass1 ==""){
                document.getElementById("passerror").innerHTML="password is required";
                return false;
            }
            //strong password validation
            if(strongPass.test(pass1)){
                document.getElementById("passerror").innerHTML="make your password strong";
                return false;
            }
            
            //confirm password validation
            if (pass2 ==""){
                document.getElementById("confirmError").innerHTML="confirm password is required";
                return false;
            }


            //confirm password validation
            if (pass1 != pass2){
                document.getElementById("confirmError").innerHTML="password doesn't match";
                return false;
            }
            else{
                alert("form submitted successfully");
                return true;
            }
        }
    </script>
</body>
</html>
