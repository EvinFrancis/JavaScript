<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css"
    />

    <title>Document</title>
  </head>
  <body>
    <style>
      .input-box {
        position: relative;
        width: 300px;
      }

      .input-box input {
        width: 80%;
        padding: 14px 50px 14px 15px; /* space for eye */
        border-radius: 14px;
        border: 2px solid #a6a8ad;
        outline: none;
        font-size: 16px;
      }

      .input-box input:focus {
        border-color: #2c2d2e; /* blue border */
      }

      .eye {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 28px;
        height: 28px;
        border: 2px solid #434447;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #2a2a2b;
      }
    </style>
    <div class="container" style="width: 200px; margin: auto">
      <h1>Registration Form</h1>
      <form action="" onsubmit="return password_validation();">
        <div class="input-box">
          <input type="password" id="password" placeholder="Password" />
          <span class="eye" onclick="togglePassword(this)">
            <i class="fa fa-eye"></i>
          </span>
        </div>

        <span id="passerror" style="color: red"></span><br /><br />

       <div class="input-box">
        <input
          type="password"
          id="confirm-password"
          placeholder="confirm password"
        />
        <span class="eye" onclick="togglePassword(this)">
            <i class="fa fa-eye"></i>
          </span>
    </div>
        <span id="confirmError" style="color: red"></span><br /><br />
        

        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>

    <script>
      function password_validation() {
        let pass1 = document.getElementById("password").value;
        let pass2 = document.getElementById("confirm-password").value;

        //pattern for strong password
        let strongPass = /^(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*]).{6,}$/;

        // clear the error message
        document.getElementById("passerror").innerHTML = "";
        document.getElementById("confirmError").innerHTML = "";
        // password validation
        if (pass1 == "") {
          document.getElementById("passerror").innerHTML =
            "password is required";
          return false;
        }
        //strong password validation
        if (!strongPass.test(pass1)) {
          document.getElementById("passerror").innerHTML =
            "make your password strong";
          return false;
        }

        //confirm password validation
        if (pass2 == "") {
          document.getElementById("confirmError").innerHTML =
            "confirm password is required";
          return false;
        }

        //confirm password validation
        if (pass1 != pass2) {
          document.getElementById("confirmError").innerHTML =
            "password doesn't match";
          return false;
        } else {
          alert("form submitted successfully");
          return true;
        }
      }
    function togglePassword(iconBox) {
    let input = document.getElementById("password");
    let icon = iconBox.querySelector("i");
    let input1 = document.getElementById("confirm-password");

    if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
    }
    if (input1.type === "confirm-password") {
        input1.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        input1.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
    }
}
    </script> 
  </body>
</html>
