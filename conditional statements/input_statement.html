<body>

    <script>

        let x=parseInt(prompt("enter a number :")) // parseInt() converts the string input to an integer
        let y=parseInt(prompt("enter secnd number :"))// parseInt() converts the string input to an integer
        let z=parseInt(prompt("enter third number :"))// parseInt() converts the string input to an integer
        if (x>y && x>z){
            console.log(x +"is greatest number...")
        }
        else if (y>x && y>z){
            console.log(y +" is greatest number...")

        }
        else{
            console.log(z +" is greatest number...")
        }

        
    </script>
