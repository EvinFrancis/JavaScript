<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const arr = [1, 6, 2, 3, 4, 5, 6, 7, 8, 9, 11, 12, 13, 14, 15];
      len = arr.length;
      count = 0;

      for (let i = 0; i < len; i++) {
        if (arr[i] > 1) {
          let prime = true;

          for (let j = 2; j < arr[i]; j++) {
            if (arr[i] % j == 0) {
              prime = false;

              break;
            }
          }
          if (prime) {
            count += 1;
            document.write(arr[i] + " - ");
          }
        }
      }
      document.write("count prime is :" + count);
    </script>
  </body>
</html>
