<body>

    <script>
        const arr=[2,3,2,33,4,5,5,56,7,78,]
        len=arr.length
        
        for(let i=0;i<len;i++){
            count=0
            for (let j=0;j<len;j++){
                if(arr[i]==arr[j]){
                    count+=1
                }
            }
            console.log(arr[i]+" count is :"+count)

        }
    </script>
