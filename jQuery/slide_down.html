<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="div1">click here to slide down</div>
    <div class="div2"> wlecome to jquery</div>
    <style>
        .div1{
            padding: 10px;
            text-align: center;
            border: solid 1px rgb(122, 119, 119);
            background-color: rgb(138, 162, 179);
            
        }
        .div2{
            
            height: 200px;
            background-color: rgb(137, 216, 84);
            text-align: center;
            padding-top: 100px;
            display: none;
            
        }
    </style>





    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function(){
            $('.div1').click(function(){
                $('.div2').slideDown(2000);
            })
            $('.div1').click(function(){
                $('.div2').slideUp(2000);
            })
        })
    </script>

</body>
</html>
