<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <div class="container" style="text-align: center; width: 200px; margin: auto;">
        <h1>Registration Form</h1>
    <form action="" method="post" onsubmit="return password_validation()">
    <input type="password" id="password" placeholder="password">
    <input type="password" id="confirm-passsword" placeholder="confirm password">
    <button type="submit" > Submit</button>
    </form>
    </div>


    <style>
        input,button{
            margin: 10px;
            padding: 10px;
            box-shadow: 0px 0px 5px 0px black;
        }
    </style>

    <script>

        function password_validation(){
            let p1=document.getElementById("password").value;
            let p2=document.getElementById("confirm-passsword").value;
            if (p1!=p2){
                alert("password doesn't match");
                return false;
            }
            else if(p1.length<8){
                alert('password should be at least 8 characters');
                return false;
            }
            else{
                return true;
            }
        }
    </script>

</body>
</html>
