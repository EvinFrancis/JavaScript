<!-- 2.Reverse a number suing a loop. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let x=parseInt(prompt("enter a number"))
        len=x.toString().length;
        let digit=0
        let sum=0


        while(x>0){
            digit=x%10
            sum=sum*10+digit
           x=Math.floor(x/10)

        }
        document.write("revered sum is >>>"+sum)
    </script>
    
</body>
</html>
