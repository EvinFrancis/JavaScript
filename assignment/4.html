    <script>
// 4.revers a array
 const arr=[1,2,3,4,5,5,4,6,6]
        const arr1=[]
        for(let i=arr.length-1;i>=0;i--){

            arr1.push(arr[i])
           
        }
        document.writeln("reversed array :"+ arr1);
        document.writeln("original array :"+ arr);

    </script>
